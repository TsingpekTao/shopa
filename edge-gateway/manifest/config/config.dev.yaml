# edge-gateway configuration (dev environment).
# Start command example:
#   gf run main.go --gf.gcfg.file=config.dev.yaml

# HTTP server configuration (OpenAPI/Swagger + optional REST APIs).
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# Application identity, used for key prefix and tracing labels.
app:
  env: "dev"
  project: "shopa"
  service: "edge-gateway"

# External dependencies.
database:
  default:
    link: "mysql:dev_user:dev_password@tcp(dev-mysql:3306)/shopa_edge_gateway_dev?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "dev-redis:6379"
    db: 0
    pass: "replace-with-dev-redis-password"

mq:
  rabbitmq:
    enabled: false
    url: "amqp://guest:guest@dev-rabbitmq:5672/"
    exchange: "shopa.events"

# Service-to-service addresses (for RPC/http client usage, can be overridden per env).
upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"
  iamHttp: "http://iam-svc:8001"
  userProfileHttp: "http://user-profile-svc:8003"
  sellerShopHttp: "http://seller-shop-svc:8007"
  mediaHttp: "http://media-svc:8006"
  catalogHttp: "http://catalog-svc:8004"
  inventoryHttp: "http://inventory-svc:8005"
  orderHttp: "http://order-svc:8008"
  cartHttp: "http://cart-svc:8009"
  paymentHttp: "http://payment-svc:8014"
  riskHttp: "http://risk-svc:8015"
  notificationHttp: "http://notification-svc:8016"
  promotionHttp: "http://promotion-svc:8017"
  searchHttp: "http://search-svc:8018"
  aftersaleHttp: "http://aftersale-svc:8010"
  reviewHttp: "http://review-svc:8011"
  fulfillmentHttp: "http://fulfillment-svc:8012"
  chatHttp: "http://chat-svc:8013"
  agentHttp: "http://agent-svc:8019"
  iamGrpc: "iam-svc:9001"
  userProfileGrpc: "user-profile-svc:8002"
  sellerShopGrpc: "seller-shop-svc:50051"
  catalogGrpc: "catalog-svc:9004"
  inventoryGrpc: "inventory-svc:9005"
  orderGrpc: "order-svc:9008"
  cartGrpc: "cart-svc:9009"
  paymentGrpc: "payment-svc:9015"
  riskGrpc: "risk-svc:9016"
  notificationGrpc: "notification-svc:9017"
  promotionGrpc: "promotion-svc:9018"
  searchGrpc: "search-svc:9019"
  pointsGrpc: "points-svc:9012"
  aftersaleGrpc: "aftersale-svc:9010"
  reviewGrpc: "review-svc:9011"
  fulfillmentGrpc: "fulfillment-svc:9014"
  chatGrpc: "chat-svc:9013"
  agentGrpc: "agent-svc:9020"

gateway:
  cors:
    allowedOrigins:
      - "http://127.0.0.1:3000"
      - "http://localhost:3000"
      - "http://127.0.0.1:3100"
      - "http://localhost:3100"
      - "http://127.0.0.1:3101"
      - "http://localhost:3101"
      - "http://127.0.0.1:3102"
      - "http://localhost:3102"
      - "http://127.0.0.1:3200"
      - "http://localhost:3200"
      - "http://localhost:3000"
      - "http://localhost:3100"
      - "http://localhost:3101"
      - "http://localhost:3102"
      - "http://localhost:3200"
    allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowedHeaders: "Authorization,Content-Type,X-Request-Id,X-User-Id,X-Account-Status-Code,X-Idempotency-Key,X-Shop-No"
    allowCredentials: true
  proxy:
    defaultTimeoutMs: 15000
    maxBodySizeMb: 64
    streamTimeoutMs: 600000
    writeRateLimitRps: 1000
    streamRateLimitRps: 200
    buyerProductsCacheEnabled: true
    buyerProductsCacheTtlSeconds: 30
    buyerProductsCacheLruCap: 512

# Object storage / media placeholders.
storage:
  provider: "local"
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: "shopa"

logger:
  level: "all"
  stdout: true

