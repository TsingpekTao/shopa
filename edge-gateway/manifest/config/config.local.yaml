# edge-gateway configuration (local environment).
# Start command example:
#   gf run main.go --gf.gcfg.file=config.local.yaml

# HTTP server configuration (OpenAPI/Swagger + optional REST APIs).
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# Application identity, used for key prefix and tracing labels.
app:
  env: "local"
  project: "shopa"
  service: "edge-gateway"

# External dependencies.
database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3307)/shopa_edge_gateway?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

mq:
  rabbitmq:
    enabled: false
    url: "amqp://guest:guest@127.0.0.1:5672/"
    exchange: "shopa.events"

# Service-to-service addresses (for RPC/http client usage, can be overridden per env).
upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"
  iamHttp: "http://127.0.0.1:8001"
  userProfileHttp: "http://127.0.0.1:8003"
  sellerShopHttp: "http://127.0.0.1:8007"
  mediaHttp: "http://127.0.0.1:8006"
  catalogHttp: "http://127.0.0.1:8004"
  inventoryHttp: "http://127.0.0.1:8005"
  orderHttp: "http://127.0.0.1:8008"
  cartHttp: "http://127.0.0.1:8009"
  paymentHttp: "http://127.0.0.1:8014"
  riskHttp: "http://127.0.0.1:8015"
  notificationHttp: "http://127.0.0.1:8016"
  promotionHttp: "http://127.0.0.1:8017"
  searchHttp: "http://127.0.0.1:8018"
  aftersaleHttp: "http://127.0.0.1:8010"
  reviewHttp: "http://127.0.0.1:8011"
  fulfillmentHttp: "http://127.0.0.1:8012"
  chatHttp: "http://127.0.0.1:8013"
  iamGrpc: "127.0.0.1:9001"
  userProfileGrpc: "127.0.0.1:8002"
  sellerShopGrpc: "127.0.0.1:50051"
  catalogGrpc: "127.0.0.1:9004"
  inventoryGrpc: "127.0.0.1:9005"
  orderGrpc: "127.0.0.1:9008"
  cartGrpc: "127.0.0.1:9009"
  paymentGrpc: "127.0.0.1:9015"
  riskGrpc: "127.0.0.1:9016"
  notificationGrpc: "127.0.0.1:9017"
  promotionGrpc: "127.0.0.1:9018"
  searchGrpc: "127.0.0.1:9019"
  pointsGrpc: "127.0.0.1:8012"
  aftersaleGrpc: "127.0.0.1:9010"
  reviewGrpc: "127.0.0.1:9011"
  fulfillmentGrpc: "127.0.0.1:9014"
  chatGrpc: "127.0.0.1:9013"

gateway:
  cors:
    allowedOrigins:
      - "http://127.0.0.1:3000"
      - "http://localhost:3000"
      - "http://127.0.0.1:3100"
      - "http://localhost:3100"
      - "http://127.0.0.1:3200"
      - "http://localhost:3200"
      - "http://localhost:3000"
      - "http://localhost:3100"
      - "http://localhost:3200"
    allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowedHeaders: "Authorization,Content-Type,X-Request-Id,X-User-Id,X-Account-Status-Code,X-Idempotency-Key"
    allowCredentials: true
  proxy:
    defaultTimeoutMs: 15000
    maxBodySizeMb: 64
    streamTimeoutMs: 600000
    writeRateLimitRps: 1000
    streamRateLimitRps: 200
    buyerProductsCacheEnabled: true
    buyerProductsCacheTtlSeconds: 30
    buyerProductsCacheLruCap: 512

# Object storage / media placeholders.
storage:
  provider: "local"
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: "shopa"

logger:
  level: "all"
  stdout: true

