# user-profile-svc configuration (dev environment).
# Start command example:
#   gf run main.go --gf.gcfg.file=config.dev.yaml

# gRPC server configuration.
grpc:
  address: ":8002"
  name: "user-profile.svc"
  logPath: ""
  logStdout: true
  errorStack: true
  errorLogEnabled: true
  errorLogPattern: "error-{Ymd}.log"
  accessLogEnabled: true
  accessLogPattern: "access-{Ymd}.log"

# HTTP server configuration (OpenAPI/Swagger + optional REST APIs).
server:
  address: ":8003"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# Application identity, used for key prefix and tracing labels.
app:
  env: "dev"
  project: "shopa"
  service: "user-profile-svc"

# External dependencies.
database:
  default:
    link: "mysql:dev_user:dev_password@tcp(dev-mysql:3306)/shopa_user_profile_svc_dev?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "dev-redis:6379"
    db: 0
    pass: "replace-with-dev-redis-password"

mq:
  rabbitmq:
    enabled: true
    url: "amqp://dev_user:dev_password@dev-rabbitmq:5672/"
    exchange: "shopa.events"
    queueRegisterInit: "user-profile.register-init.q"
    routingKeyUserRegistered: "iam.user.registered"

# Service-to-service addresses (for RPC/http client usage, can be overridden per env).
upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"

# Object storage / media placeholders.
storage:
  provider: "local"
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: "shopa"

logger:
  level: "all"
  stdout: true
