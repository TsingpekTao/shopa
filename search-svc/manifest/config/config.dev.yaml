# search-svc configuration (dev environment).
server:
  address: ":8018"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

grpc:
  address: ":9019"
  name: "search.svc"
  logStdout: true

app:
  env: "dev"
  project: "shopa"
  service: "search-svc"

database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/shopa_search_svc?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

elasticsearch:
  addresses:
    - "http://127.0.0.1:9200"
  username: ""
  password: ""
  indexPrefix: "shopa_search"
  requestTimeout: "5s"
  enableSniff: false

worker:
  searchOutbox:
    enabled: true
    intervalSeconds: 10
    batchSize: 50
  physicalDelete:
    enabled: true
    intervalSeconds: 300
    batchSize: 50
    retentionHours: 168

logger:
  level: "all"
  stdout: true
