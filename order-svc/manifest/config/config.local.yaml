# order-svc configuration (local environment).
# Start command example:
#   gf run main.go --gf.gcfg.file=config.local.yaml

# HTTP server configuration (OpenAPI/Swagger + optional REST APIs).
server:
  address: ":8008"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# Application identity, used for key prefix and tracing labels.
app:
  env: "local"
  project: "shopa"
  service: "order-svc"

# External dependencies.
database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3307)/shopa_order_svc?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

mq:
  rabbitmq:
    enabled: false
    url: "amqp://guest:guest@127.0.0.1:5672/"
    exchange: "shopa.events"

# Service-to-service addresses (for RPC/http client usage, can be overridden per env).
upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8001"
  points:
    enabled: true
    baseUrl: "http://127.0.0.1:8021"
    timeoutMs: 3000
    previewPath: "/v1/points/internal/order/preview"
    lockPath: "/v1/points/internal/order/lock"
    cancelPath: "/v1/points/internal/order/cancel"
    confirmPath: "/v1/points/internal/order/confirm"
    grantPath: "/v1/points/internal/order/grant"

worker:
  pointsCompensation:
    enabled: true
    intervalSeconds: 10
    batchSize: 20
    maxRetry: 12

# Object storage / media placeholders.
storage:
  provider: "local"
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: "shopa"

logger:
  level: "all"
  stdout: true

