syntax = "proto3";

package shopa.review.event.v1;

option go_package = "github.com/TsingpekTao/shopa/review-svc/api/event/v1;revieweventv1";

import "google/protobuf/timestamp.proto";

message ReviewCreatedEvent {
  string event_id = 1;
  string review_no = 2;
  string shop_no = 3;
  string spu_no = 4;
  string sku_no = 5;
  uint32 score = 6;
  bool with_media = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

message ReviewUpdatedEvent {
  string event_id = 1;
  string review_no = 2;
  string shop_no = 3;
  string spu_no = 4;
  string sku_no = 5;
  string change_type = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message SpuRatingSummaryChangedEvent {
  string event_id = 1;
  string spu_no = 2;
  uint64 total_reviews = 3;
  uint64 avg_score_x100 = 4;
  uint64 positive_rate_x100 = 5;
  uint64 score_1_count = 6;
  uint64 score_2_count = 7;
  uint64 score_3_count = 8;
  uint64 score_4_count = 9;
  uint64 score_5_count = 10;
  google.protobuf.Timestamp occurred_at = 11;
}
