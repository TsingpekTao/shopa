# chat-svc configuration (dev environment).

server:
  address: ":8013"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

app:
  env: "dev"
  project: "shopa"
  service: "chat-svc"

database:
  default:
    link: "mysql:dev_user:dev_password@tcp(dev-mysql:3306)/shopa_chat_svc_dev?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "dev-redis:6379"
    db: 0
    pass: "replace-with-dev-redis-password"

mq:
  rabbitmq:
    enabled: false
    url: "amqp://guest:guest@dev-rabbitmq:5672/"
    exchange: "shopa.events"

upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"
  userProfileGrpc: "user-profile-svc:8002"
  sellerShopGrpc: "seller-shop-svc:50051"

chat:
  backplane:
    channel: "chat:backplane:v1"
    enabled: true

logger:
  level: "all"
  stdout: true
