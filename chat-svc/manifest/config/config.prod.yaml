# chat-svc configuration (prod environment).

server:
  address: ":8013"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

app:
  env: "prod"
  project: "shopa"
  service: "chat-svc"

database:
  default:
    link: "mysql:prod_user:prod_password@tcp(prod-mysql:3306)/shopa_chat_svc_prod?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "prod-redis:6379"
    db: 0
    pass: "replace-with-prod-redis-password"

mq:
  rabbitmq:
    enabled: true
    url: "amqp://prod_user:prod_password@prod-rabbitmq:5672/"
    exchange: "shopa.events"

upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"
  userProfileGrpc: "user-profile-svc:8002"
  sellerShopGrpc: "seller-shop-svc:50051"

chat:
  backplane:
    channel: "chat:backplane:v1"
    enabled: true

logger:
  level: "warn"
  stdout: true
