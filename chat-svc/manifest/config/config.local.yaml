# chat-svc configuration (local environment).
# Start command example:
#   gf run main.go --gf.gcfg.file=config.local.yaml

server:
  address: ":8013"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

app:
  env: "local"
  project: "shopa"
  service: "chat-svc"

database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3307)/shopa_chat_svc?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

mq:
  rabbitmq:
    enabled: false
    url: "amqp://guest:guest@127.0.0.1:5672/"
    exchange: "shopa.events"

upstream:
  edgeGateway: "edge-gateway:8000"
  iam: "iam-svc:8001"
  userProfile: "user-profile-svc:8003"
  userProfileGrpc: "127.0.0.1:8002"
  sellerShopGrpc: "127.0.0.1:50051"

chat:
  backplane:
    channel: "chat:backplane:v1"
    enabled: true

logger:
  level: "all"
  stdout: true
