# payment-svc configuration (local environment).
server:
  address: ":8014"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

grpc:
  address: ":9015"
  name: "payment.svc"
  logStdout: true

app:
  env: "local"
  project: "shopa"
  service: "payment-svc"

database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/shopa_payment_svc?charset=utf8mb4&parseTime=true&loc=Local"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

logger:
  level: "all"
  stdout: true
